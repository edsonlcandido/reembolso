<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="50" r="80" fill="#1e3a8a" opacity="0.3"/>
  <circle cx="1100" cy="550" r="150" fill="#0d9488" opacity="0.2"/>
  
  <!-- Content -->
  <g>
    <!-- Icon -->
    <rect x="400" y="100" width="400" height="250" fill="white" rx="12" opacity="0.95"/>
    
    <!-- Receipt icon inside -->
    <rect x="475" y="145" width="250" height="160" fill="#f3f4f6" rx="4"/>
    <line x1="500" y1="165" x2="700" y2="165" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
    <line x1="500" y1="200" x2="680" y2="200" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
    <line x1="500" y1="225" x2="675" y2="225" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
    <line x1="500" y1="250" x2="720" y2="250" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Checkmark circle -->
    <circle cx="710" cy="275" r="35" fill="url(#accentGradient)"/>
    <path d="M695 275 L705 285 L730 270" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Main headline -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">
    Reembolsa AI
  </text>
  
  <!-- Subheadline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="white" opacity="0.95">
    Tire foto. A IA faz o resto.
  </text>
  
  <!-- CTA -->
  <rect x="400" y="530" width="400" height="60" fill="white" rx="8"/>
  <text x="600" y="568" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#3b82f6">
    Comece Gratuitamente
  </text>
</svg>