<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Background -->
  <rect width="48" height="48" fill="#3b82f6" rx="8"/>
  
  <!-- Reembolso icon - receipt with checkmark -->
  <g>
    <!-- Receipt shape -->
    <rect x="10" y="8" width="28" height="32" fill="white" rx="2"/>
    
    <!-- Receipt lines -->
    <line x1="14" y1="14" x2="34" y2="14" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="19" x2="30" y2="19" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="24" x2="28" y2="24" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="29" x2="32" y2="29" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Checkmark -->
    <circle cx="34" cy="34" r="5" fill="#10b981"/>
    <path d="M32 34 L33.5 35.5 L36 33" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>